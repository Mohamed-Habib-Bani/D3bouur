<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}D3BOUUR{% endblock %} — AcaROBOTICS</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="brand">D3BOUUR <span>· AcaROBOTICS</span></div>
        <nav>
            {% for href, label in nav %}
            <a href="{{ href }}" class="{{ 'active' if request.url.path == href else '' }}">{{ label }}</a>
            {% endfor %}
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <p>AcaROBOTICS — robot d'accueil D3BOUUR (interface de démonstration)</p>
    </footer>
</body>
</html>
